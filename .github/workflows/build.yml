name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast check on Linux: engine tests, full plugin build, VST3 host check.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DILLUMINIZE_DEV_TOOLS=ON

      - name: Build
        run: cmake --build build --target EngineTests IlluminizeShaper_VST3 HostCheck UiSnapshot

      - name: Engine tests
        run: ctest --test-dir build --output-on-failure

      - name: VST3 host check
        run: ./build/HostCheck_artefacts/Release/HostCheck "build/IlluminizeShaper_artefacts/Release/VST3/Illuminize Shaper.vst3"

      - name: UI screenshots
        run: ./build/UiSnapshot_artefacts/Release/UiSnapshot screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/*.png

  # The plugin you install: macOS Apple Silicon, VST3 + AU.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DILLUMINIZE_DEV_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release -j 3 --target EngineTests IlluminizeShaper_VST3 IlluminizeShaper_AU HostCheck

      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Sign (ad-hoc) and package
        run: |
          set -e
          ART=build/IlluminizeShaper_artefacts/Release
          PKG="pkg/Illuminize Shaper"
          mkdir -p "$PKG"
          cp -R "$ART/VST3/Illuminize Shaper.vst3" "$PKG/"
          cp -R "$ART/AU/Illuminize Shaper.component" "$PKG/"
          codesign --force --deep --sign - "$PKG/Illuminize Shaper.vst3"
          codesign --force --deep --sign - "$PKG/Illuminize Shaper.component"
          cp packaging/Install.command packaging/INSTALL.txt "$PKG/"
          chmod +x "$PKG/Install.command"
          ditto -c -k --keepParent "$PKG" Illuminize-Shaper-macOS.zip

      # Upload the zip itself: it keeps the bundles' permissions and signatures intact.
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminize-Shaper-macOS
          path: Illuminize-Shaper-macOS.zip
          if-no-files-found: error

      - name: VST3 host check
        run: ./build/HostCheck_artefacts/Release/HostCheck "pkg/Illuminize Shaper/Illuminize Shaper.vst3"

      - name: AU validation (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "pkg/Illuminize Shaper/Illuminize Shaper.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aufx IlSh Illu

      - name: pluginval (strictness 5)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            --validate "pkg/Illuminize Shaper/Illuminize Shaper.vst3"
